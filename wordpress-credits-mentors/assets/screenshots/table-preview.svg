    <line x1="72" y1="326" x2="1208" y2="326" stroke="#e0e0e0"/>
    <line x1="72" y1="414" x2="1208" y2="414" stroke="#e0e0e0"/>
    <circle cx="104" cy="214" r="16" fill="#dcdcde"/><text x="130" y="220">Jane Mentor</text>
    <text x="360" y="220">jane@example.org</text>
    <text x="560" y="220" fill="#2271b1">wordpress.org/janementor</text>
    <rect x="784" y="198" width="54" height="24" rx="12" fill="#e8f0fe"/><text x="811" y="215" text-anchor="middle" fill="#1967d2">Core</text>
    <rect x="844" y="198" width="72" height="24" rx="12" fill="#e8f0fe"/><text x="880" y="215" text-anchor="middle" fill="#1967d2">Design</text>
    <text x="1018" y="220">4</text>
    <text x="1088" y="220">Example Co.</text>

    <circle cx="104" cy="302" r="16" fill="#dcdcde"/><text x="130" y="308">Marco Contributor</text>
    <text x="360" y="308">marco@example.org</text>
    <text x="560" y="308" fill="#2271b1">wordpress.org/marcoc</text>
    <rect x="784" y="286" width="96" height="24" rx="12" fill="#e8f0fe"/><text x="832" y="303" text-anchor="middle" fill="#1967d2">Community</text>
    <text x="1018" y="308">2</text>
    <text x="1088" y="308">-</text>

    <circle cx="104" cy="390" r="16" fill="#dcdcde"/><text x="130" y="396">Aisha Supporter</text>
    <text x="360" y="396">aisha@example.org</text>
    <text x="560" y="396" fill="#2271b1">wordpress.org/aishas</text>
    <rect x="784" y="374" width="106" height="24" rx="12" fill="#e8f0fe"/><text x="837" y="391" text-anchor="middle" fill="#1967d2">Polyglots</text>
    <text x="1018" y="396">5</text>
    <text x="1088" y="396">Sponsor Lab</text>
