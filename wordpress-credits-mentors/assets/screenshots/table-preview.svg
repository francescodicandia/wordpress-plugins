<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">WordPress Credits Mentors table preview</title>
  <desc id="desc">Illustrative preview of the shortcode table view with full name, email, profile, expertise, hours, and sponsor company.</desc>
  <rect width="1280" height="760" fill="#f6f7f7"/>
  <text x="72" y="84" fill="#1d2327" font-family="Arial, sans-serif" font-size="34" font-weight="700">[wpcredits_mentors view=table]</text>
  <rect x="72" y="126" width="1136" height="534" rx="16" fill="#ffffff" stroke="#dcdcde"/>
  <rect x="72" y="126" width="1136" height="64" rx="16" fill="#f0f0f1"/>
  <g fill="#1d2327" font-family="Arial, sans-serif" font-size="18" font-weight="700">
    <text x="108" y="166">Full Name</text>
    <text x="360" y="166">Email</text>
    <text x="560" y="166">WordPress profile</text>
    <text x="784" y="166">Expertise</text>
    <text x="1000" y="166">Hours</text>
    <text x="1088" y="166">Sponsor</text>
  </g>
  <g font-family="Arial, sans-serif" font-size="16" fill="#1d2327">
