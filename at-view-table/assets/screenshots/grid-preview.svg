<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">AT View Table inspect tool preview</title>
  <desc id="desc">Illustrative preview of the manual Inspect Table tool showing Airtable fields and types.</desc>
  <rect width="1280" height="760" fill="#f6f7f7"/>
  <text x="76" y="84" fill="#1d2327" font-family="Arial, sans-serif" font-size="34" font-weight="700">Inspect Table</text>
  <rect x="76" y="128" width="1128" height="520" rx="18" fill="#ffffff" stroke="#dcdcde"/>
  <text x="112" y="180" fill="#1d2327" font-family="Arial, sans-serif" font-size="20" font-weight="700">Table ID</text>
  <rect x="112" y="198" width="360" height="42" rx="8" fill="#ffffff" stroke="#8c8f94"/>
  <text x="132" y="225" fill="#1d2327" font-family="Arial, sans-serif" font-size="20">tblXXXXXXXXXXXXXX</text>
  <rect x="492" y="194" width="126" height="46" rx="8" fill="#2271b1"/>
  <text x="516" y="223" fill="#ffffff" font-family="Arial, sans-serif" font-size="18" font-weight="700">Inspect</text>
  <text x="112" y="296" fill="#1d2327" font-family="Arial, sans-serif" font-size="26" font-weight="700">Fields found</text>
  <rect x="112" y="322" width="1056" height="250" rx="12" fill="#ffffff" stroke="#dcdcde"/>
  <rect x="112" y="322" width="1056" height="52" rx="12" fill="#f0f0f1"/>
  <text x="148" y="355" fill="#1d2327" font-family="Arial, sans-serif" font-size="18" font-weight="700">Field Name</text>
  <text x="890" y="355" fill="#1d2327" font-family="Arial, sans-serif" font-size="18" font-weight="700">Type</text>
  <g fill="#1d2327" font-family="Arial, sans-serif" font-size="18">
    <text x="148" y="416">Name</text><text x="890" y="416">singleLineText</text>
    <text x="148" y="462">Status</text><text x="890" y="462">singleSelect</text>
    <text x="148" y="508">Owner</text><text x="890" y="508">singleLineText</text>
  </g>
  <text x="112" y="620" fill="#50575e" font-family="Arial, sans-serif" font-size="17">Copy for fields: Name,Status,Owner</text>
</svg>
