<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">AT View Table settings preview</title>
  <desc id="desc">Illustrative preview of the plugin settings page with Airtable base ID, API token, and default row limit.</desc>
  <rect width="1280" height="760" fill="#f6f7f7"/>
  <rect x="48" y="40" width="1184" height="680" rx="16" fill="#ffffff" stroke="#dcdcde"/>
  <text x="88" y="104" fill="#1d2327" font-family="Arial, sans-serif" font-size="34" font-weight="700">AT View Table Settings</text>
  <rect x="88" y="144" width="1104" height="214" rx="12" fill="#f9f9f9" stroke="#dcdcde"/>
  <text x="120" y="190" fill="#1d2327" font-family="Arial, sans-serif" font-size="20" font-weight="700">Airtable Base ID</text>
  <rect x="120" y="208" width="420" height="42" rx="8" fill="#ffffff" stroke="#8c8f94"/>
  <text x="140" y="235" fill="#1d2327" font-family="Arial, sans-serif" font-size="20">appXXXXXXXXXXXXXX</text>
  <text x="620" y="190" fill="#1d2327" font-family="Arial, sans-serif" font-size="20" font-weight="700">Airtable API Token</text>
  <rect x="620" y="208" width="440" height="42" rx="8" fill="#ffffff" stroke="#8c8f94"/>
  <text x="640" y="235" fill="#8c8f94" font-family="Courier New, monospace" font-size="20">pat***********************</text>
  <text x="120" y="290" fill="#1d2327" font-family="Arial, sans-serif" font-size="20" font-weight="700">Default Limit</text>
  <rect x="120" y="308" width="120" height="42" rx="8" fill="#ffffff" stroke="#8c8f94"/>
  <text x="170" y="335" text-anchor="middle" fill="#1d2327" font-family="Arial, sans-serif" font-size="20">25</text>
  <rect x="1096" y="302" width="84" height="46" rx="8" fill="#2271b1"/>
  <text x="1115" y="331" fill="#ffffff" font-family="Arial, sans-serif" font-size="18" font-weight="700">Save</text>
  <text x="120" y="412" fill="#1d2327" font-family="Arial, sans-serif" font-size="28" font-weight="700">How To Use</text>
  <rect x="120" y="440" width="1040" height="176" rx="12" fill="#ffffff" stroke="#dcdcde"/>
  <text x="154" y="482" fill="#1d2327" font-family="Arial, sans-serif" font-size="18" font-weight="700">Shortcode</text>
  <text x="154" y="520" fill="#50575e" font-family="Courier New, monospace" font-size="18">[at_view_table table_id="tblXXXXXXXXXXXXXX" fields="Name,Status"]</text>
  <text x="154" y="560" fill="#1d2327" font-family="Arial, sans-serif" font-size="17">Required: table_id, fields</text>
  <text x="154" y="592" fill="#1d2327" font-family="Arial, sans-serif" font-size="17">Optional: filter_field, filter_value, sort_field, sort_direction, limit</text>
  <text x="120" y="712" fill="#50575e" font-family="Arial, sans-serif" font-size="17">Illustrative admin settings preview for AT View Table.</text>
</svg>
