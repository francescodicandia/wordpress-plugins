<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">AT View Table table preview</title>
  <desc id="desc">Illustrative preview of the shortcode table view with generic Airtable columns, filtering, sorting, and row limiting.</desc>
  <rect width="1280" height="760" fill="#f6f7f7"/>
  <text x="72" y="84" fill="#1d2327" font-family="Arial, sans-serif" font-size="28" font-weight="700">[at_view_table table_id="tblXXXXXXXXXXXXXX" fields="Name,Status,Owner"]</text>
  <rect x="72" y="126" width="1136" height="534" rx="16" fill="#ffffff" stroke="#dcdcde"/>
  <rect x="72" y="126" width="1136" height="64" rx="16" fill="#f0f0f1"/>
  <g fill="#1d2327" font-family="Arial, sans-serif" font-size="18" font-weight="700">
    <text x="108" y="166">Name</text>
    <text x="360" y="166">Status</text>
    <text x="560" y="166">Owner</text>
    <text x="784" y="166">Region</text>
    <text x="970" y="166">Priority</text>
    <text x="1088" y="166">Score</text>
  </g>
  <g font-family="Arial, sans-serif" font-size="16" fill="#1d2327">
    <line x1="72" y1="238" x2="1208" y2="238" stroke="#e0e0e0"/>
    <line x1="72" y1="326" x2="1208" y2="326" stroke="#e0e0e0"/>
    <line x1="72" y1="414" x2="1208" y2="414" stroke="#e0e0e0"/>
    <text x="108" y="220">Alpha Project</text>
    <text x="360" y="220">Active</text>
    <text x="560" y="220">M. Rossi</text>
    <text x="784" y="220">EMEA</text>
    <text x="986" y="220">High</text>
    <text x="1088" y="220">92</text>

    <text x="108" y="308">Beta Project</text>
    <text x="360" y="308">Paused</text>
    <text x="560" y="308">A. Smith</text>
    <text x="784" y="308">North America</text>
    <text x="986" y="308">Medium</text>
    <text x="1088" y="308">74</text>

    <text x="108" y="396">Gamma Project</text>
    <text x="360" y="396">Active</text>
    <text x="560" y="396">L. Chen</text>
    <text x="784" y="396">APAC</text>
    <text x="986" y="396">Low</text>
    <text x="1088" y="396">63</text>
  </g>
  <text x="72" y="712" fill="#50575e" font-family="Arial, sans-serif" font-size="17">Illustrative AT View Table preview with generic Airtable columns.</text>
</svg>
